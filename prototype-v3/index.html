function scheduleSessionMarkup(a,role){const tag=a.state==='Cancelled'?'red':a.state==='Rescheduled'?'amber':'green';return `<div class="session-row ${a.state==='Cancelled'?'cancelled':''}"><div class="time"><b>${a.start}</b><br>${a.end}</div><div class="desc"><b>${h(a.name)}</b><small>${h(a.room)} · ${role==='teacher'?a.students.length+' enrolled':role==='parent'?a.students.join(', '):h(a.teacher)}</small><span class="tag ${tag}">${a.state}</span></div><button onclick="${role==='student'?"go('studentclass')":role==='teacher'?"go('attendance')":role==='admin'?"go('batchdetail')":"toast('Session details: '+ '"+a.name.replaceAll("'",'')+"')"}">${role==='teacher'?'Roster':'View'}</button></div>`}
function scheduleView(role){initSchedule();const d=parseDate(S.scheduleDate);const all=scheduleSessions(role);const view=S.scheduleView;let head='',main='';const title=view==='month'?niceDate(d,{month:'long',year:'numeric'}):view==='week'?(()=>{const monday=addDays(d,-(d.getDay()+6)%7);return niceDate(monday,{day:'numeric',month:'short'})+' – '+niceDate(addDays(monday,6),{day:'numeric',month:'short',year:'numeric'})})():niceDate(d,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const filter=role==='parent'?`<label class="eyebrow">Child<select class="role-filter" onchange="S.familyScheduleFilter=this.value;render()"><option value="all" ${S.familyScheduleFilter==='all'?'selected':''}>All children</option>${['Aarav','Diya'].map(n=>`<option value="${n}" ${S.familyScheduleFilter===n?'selected':''}>${n}</option>`).join('')}</select></label>`:role==='admin'?`<label class="eyebrow">Batch<select class="role-filter" onchange="S.ownerScheduleFilter=this.value;render()">${['all','Guitar','Keyboard','Vocals','Workshop'].map(n=>`<option value="${n}" ${S.ownerScheduleFilter===n?'selected':''}>${n==='all'?'All batches':n}</option>`).join('')}</select></label>`:'';
 if(view==='day'){const day=all.filter(a=>a.date===S.scheduleDate).sort((a,b)=>a.start.localeCompare(b.start));main=day.length?day.map(a=>scheduleSessionMarkup(a,role)).join(''):`<div class="notice info">No scheduled classes on this date.</div>`;}
 else if(view==='week'){const monday=addDays(d,-(d.getDay()+6)%7);const days=Array.from({length:7},(_,i)=>addDays(monday,i));main=`<div class="week-strip">${days.map(t=>{const iso=dateISO(t),count=all.filter(a=>a.date===iso).length;return `<button class="week-cell ${iso===S.scheduleDate?'active':''}" onclick="scheduleSetDate('${iso}')"><small>${niceDate(t,{weekday:'short'})}</small><b>${t.getDate()}</b><small>${count?count+' class'+(count===1?'':'es'):'—'}</small></button>`}).join('')}</div>`+days.map(t=>{const sessions=all.filter(a=>a.date===dateISO(t));return sessions.length?`<div class="dayhead">${niceDate(t,{weekday:'long',day:'numeric',month:'short'})}</div>${sessions.map(a=>scheduleSessionMarkup(a,role)).join('')}`:''}).join('');if(!all.some(a=>days.some(t=>dateISO(t)===a.date)))main+='<div class="notice info">No classes scheduled this week.</div>'}
 else {const first=new Date(d.getFullYear(),d.getMonth(),1,12),start=addDays(first,-(first.getDay()+6)%7);const days=Array.from({length:42},(_,i)=>addDays(start,i));main=`<div class="month-grid">${['M','T','W','T','F','S','S'].map(x=>`<div class="dayhead" style="text-align:center">${x}</div>`).join('')}${days.map(t=>{const iso=dateISO(t);const sessions=all.filter(a=>a.date===iso);return `<button class="month-cell ${t.getMonth()!==d.getMonth()?'out':''} ${iso===S.scheduleDate?'active':''}" onclick="scheduleSetDate('${iso}')">${t.getDate()}<span class="dots">${sessions.length?'●'.repeat(Math.min(3,sessions.length)):''}</span></button>`}).join('')}</div><div class="dayhead">${niceDate(d,{weekday:'long',day:'numeric',month:'short'})} · ${all.filter(a=>a.date===S.scheduleDate).length} session(s)</div>${all.filter(a=>a.date===S.scheduleDate).map(a=>scheduleSessionMarkup(a,role)).join('')||'<div class="notice info">Select another date to view its classes.</div>'}`}
 return `<h1 class="headline">${role==='admin'?'Academy calendar':role==='teacher'?'My teaching schedule':role==='parent'?'Family schedule':'My timetable'}</h1><p class="support">Day, week and month views · ${role==='admin'?'all academy classes':role==='teacher'?'assigned classes only':role==='parent'?'linked children only':'my enrolled classes only'}</p><div class="pilltabs">${['day','week','month'].map(x=>`<button class="${view===x?'active':''}" onclick="scheduleChangeView('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div class="schedule-top"><button onclick="scheduleMove(-1)" aria-label="Previous ${view}">‹</button><div class="schedule-date">${title}</div><button onclick="scheduleMove(1)" aria-label="Next ${view}">›</button></div><div class="align" style="margin-bottom:12px"><button class="btn small ghost" onclick="S.scheduleDate='2026-10-14';render()">Demo today</button><span class="support">${all.length} example sessions</span></div>${filter}${main}${role==='admin'?btn('＋ Add class','newbatch','block secondary'):role==='teacher'?btn('Mark attendance','attendance','block secondary'):''}<p class="support" style="margin-top:14px">Demo schedule uses illustrative sessions. In production, dates and visibility come from the academy database.</p>`;
}

case 'allocate':c=`<h1 class="headline">Allocate a payment</h1><p class="support">Split a payment across invoices or preserve unallocated credit.</p>${card('Payment received',`<h1>${fmt(5000)}</h1><span class="tag green">Verified UPI</span>`)}${field('Aarav — October invoice (₹)','alloc1','2000','number')}${field('Diya — October invoice (₹)','alloc2','2500','number')}${bb('Apply allocation',`let a=Number(v('alloc1')||0),b=Number(v('alloc2')||0);if(a+b>5000){toast('Allocation exceeds payment')}else{S.credit=5000-a-b;toast('Allocated '+fmt(a+b)+'. Credit '+fmt(S.credit));go('receipt')}`,'block')}`;break;

case 'promise':c=`<h1 class="headline">Promise to pay</h1><p class="support">Log a commitment and prevent unnecessary follow-ups.</p>${card('Rohan Sharma',`<b>₹2,000 overdue</b><p class="support">Monthly tuition · 12 days overdue</p>`)}${field('Promised payment date','promisedate',S.promiseDate||'2026-10-17','date')}${select('Reminder handling','snooze',['Pause reminders until promised date','Continue standard reminders'],'Pause reminders until promised date')}${bb('Save promise',`S.promiseDate=v('promisedate');S.promiseSaved=true;go('money')`,'block')}${S.promiseSaved?'<div class="notice green">Promise saved</div>':''}`;break;
case 'receipt':c=`<h1 class="headline">Payment receipt</h1>${receipt()}<div class="btnrow">${bb('Copy receipt link',`navigator.clipboard?.writeText('https://classpay.demo/receipt/CP-0144');toast('Demo link copied')`,'secondary')}${btn('Done','home')}</div><p class="support">Demo receipt only; no downloadable tax invoice is issued.</p>`;break;
case 'parenthome':c=`<div class="align"><div><div class="eyebrow">Welcome, Neha</div><h1 class="headline">Family fees</h1></div><span class="avatar">NS</span></div>${card('Amount due',`<div class="align"><h1 style="margin:0;font-size:30px">${fmt(S.status==='paid'?0:4500)}</h1>${statusTag()}</div><p class="support">Across 2 children · Due 5 Oct</p>${btn('Pay now','family','block')}`)}${card('Your children',row('Aarav Sharma','Guitar Beginners · ₹2,000',btn('View','family','small secondary'))+row('Diya Sharma','Keyboard A2 · ₹2,500',btn('View','family','small secondary')))}${card('Next class',`<b>Guitar Beginners</b><p class="support">Wed, 14 Oct · 10:00–11:00 AM</p>`)}${btn('Family schedule','parentschedule','block secondary')}${btn('Payment history','parenthistory','block secondary')}`;break;
case 'feeurl':c=`<div class="illustration">🔗</div><h1 class="headline">Fee payment link</h1><p class="support">Pay without installing an app.</p>${card('Swar Music Academy',`<b>Family: Sharma</b><p class="support">Invoice October 2026 · ₹4,500</p><span class="tag green">Demo link verified</span>`)}${btn('View family bill','family','block')}`;break;
case 'family':c=`<h1 class="headline">Family bill</h1><p class="support">You can pay both children together.</p>${card('October 2026',`<div class="align"><span>Aarav · Guitar</span><b>₹2,000</b></div><hr class="divider"><div class="align"><span>Diya · Keyboard</span><b>₹2,500</b></div><hr class="divider"><div class="align"><b>Total payable</b><b style="font-size:22px">₹4,500</b></div>`)}${bb('Continue to payment',`S.amount=4500;go('methods')`,'block')}${btn('Request a payment date','promise','block secondary')}`;break;
case 'checkout':case 'methods':c=`<h1 class="headline">Choose how to pay</h1><p class="support">Total due ${fmt(S.amount)}</p>${[['UPI','Pay using any UPI app'],['Card','Debit or credit card'],['Net banking','Bank account'],['Direct UPI + proof','I already transferred']].map(([x,sub])=>`<button class="control" onclick="set('method','${x}');go('${x.includes('proof')?'proof':'upipending'}')"><b>${x}</b><span>${sub} ›</span></button>`).join('')}<div class="notice info">Demo checkout: no real payment requests will be made.</div>`;break;
case 'upipending':c=`<div class="illustration">⌛</div><h1 class="headline">Waiting for ${h(S.method)} payment</h1><p class="support">Complete the payment in your UPI or banking app. In this prototype, choose a simulated outcome.</p>${card('Payment request',`<h1>${fmt(S.amount)}</h1><span class="tag amber">Pending</span>`)}${bb('Simulate successful payment',`S.status='paid';S.collected+=S.amount;go('success')`,'block success')}${btn('Simulate pending / failed','stillpending','block secondary')}${btn('I paid externally — upload proof','proof','block ghost')}`;break;
case 'proof':c=`<h1 class="headline">Upload payment proof</h1><p class="support">For direct UPI / bank transfers requiring academy approval.</p>${field('UPI transaction / UTR number','utrinput',S.utr,'text','12-digit reference') }<label class="field">Screenshot (optional demo file)<input type="file" id="prooffile" accept="image/*"></label>${field('Amount paid','proofamount',S.amount,'number')}${bb('Submit for verification',`if(!v('utrinput')){toast('Enter UTR or payment reference')}else{S.utr=v('utrinput');S.amount=Number(v('proofamount'));S.status='pending';S.pendingCount++;go('stillpending')}`,'block')}`;break;
case 'success':c=`<div class="illustration" style="font-size:62px">✅</div><h1 class="headline" style="text-align:center">Payment successful!</h1><p class="support" style="text-align:center">Your payment of ${fmt(S.amount)} is confirmed in this demo.</p>${receipt()}${btn('View receipt','receipt','block')}${btn('Return to family','parenthome','block secondary')}`;break;
case 'stillpending':c=`<div class="illustration">⏳</div><h1 class="headline">Payment not confirmed yet</h1><p class="support">No receipt will be issued until the payment is verified.</p><div class="notice">${S.paymentIssue?'Proof was rejected: '+h(S.paymentIssue):'If money was debited, avoid paying again until status is checked.'}</div>${btn('Upload / replace proof','proof','block')}${btn('Check family bill','family','block secondary')}`;break;
case 'parenthistory':c=`<h1 class="headline">Payments & receipts</h1>${card('October',row('Current fee','₹4,500 · '+S.status,'',S.status==='paid'?'Paid':'Pending'))}${card('Previous',row('September 2026','₹4,500 · UPI',btn('Receipt','receipt','small secondary'),'Paid')+row('August 2026','₹4,500 · Cash',btn('Receipt','receipt','small secondary'),'Paid'))}`;break;
case 'teacherhome':c=`<h1 class="headline">Good afternoon, Rahul</h1><p class="support">You have 2 sessions today.</p>${card('10:00–11:00 AM',`<b>Guitar Beginners</b><p class="support">Studio 1 · 8 students</p>${btn('Mark attendance','attendance','block')}`)}${card('4:00–5:00 PM',`<b>Vocals — Intermediate</b><p class="support">Studio 1 · 7 students</p>${btn('View schedule','teachercalendar','block secondary')}`)}${card('Week ahead',row('Wednesday','2 scheduled sessions')+row('Friday','Guitar Advanced'))}`;break;
case 'attendance':c=`<h1 class="headline">Mark attendance</h1><p class="support">Guitar Beginners · Today, 10 AM</p>${S.studentNames.map((x,i)=>`<div class="control"><b>${h(x)}</b><label><input style="accent-color:var(--green)" type="checkbox" id="att${i}" ${S.attendance[i]?'checked':''} onchange="S.attendance[${i}]=this.checked"> Present</label></div>`).join('')}${bb('Save attendance',`toast('Attendance saved in demo')`,'block')}${btn('Issue make-up credit','makeup','block secondary')}`;break;
case 'makeup':c=`<h1 class="headline">Issue make-up credit</h1><p class="support">Compensate an eligible cancelled or missed session.</p>${select('Student','creditstudent',S.studentNames,'Aarav Sharma')}${select('Reason','creditreason',['Teacher cancelled','Approved absence','Holiday adjustment'],'Teacher cancelled')}${field('Credit expiry date','expire','2026-12-31','date')}${bb('Issue 1 lesson credit',`S.credit+=1;toast('One make-up lesson credited');go('teacherhome')`,'block')}`;break;
case 'revenue':case 'business':c=`<h1 class="headline">Revenue overview</h1>${select('Period','reportperiod',['October 2026','September 2026','This quarter'],S.reportPeriod)}<div class="metrics">${stat('Collected',fmt(S.collected),'ok')}${stat('Outstanding','₹42,000')}${stat('Collection rate','65%')}</div>${card('Revenue trend',lines([['May',45],['Jun',58],['Jul',70],['Aug',64],['Sep',83],['Oct',65]])+'<p class="support">Illustrative data only</p>')}${card('Payment channel mix',`<div class="pie"></div><div class="align"><span>● UPI 61%</span><span>● Cash 27%</span><span>● Other 12%</span></div>`)}${btn('Export report','exports','block secondary')}`;break;
case 'aging':c=`<h1 class="headline">Overdue aging</h1>${card('Receivables at risk',`<h1>₹18,500</h1><p class="support">5 families past due</p>`)}${card('Aging distribution',lines([['0–7d',80],['8–30d',52],['30+d',18]]))}${card('Oldest outstanding',row('Rohan Sharma','₹2,000 · 12 days',btn('Contact','promise','small secondary'),'Overdue')+row('Priya Patel','₹3,500 · 8 days',btn('Contact','promise','small secondary'),'Overdue'))}`;break;
case 'profit':c=`<h1 class="headline">Batch profitability</h1><div class="notice">Illustrative profitability. Accurate figures require expenses and allocation rules.</div>${card('Estimated net contribution',`<h1>₹58,500</h1><p class="support">Revenue minus sample assigned costs</p>`)}${S.batches.map((x,i)=>card(x,`<div class="align"><span>Revenue</span><b>${fmt([24000,20000,18000][i])}</b></div><div class="align"><span>Costs</span><b>${fmt([4000,6500,5500][i])}</b></div><hr class="divider"><div class="align"><b>Contribution</b><b style="color:var(--green)">${fmt([20000,13500,12500][i])}</b></div>`)).join('')}`;break;
case 'reconcile':c=`<h1 class="headline">Payment reconciliation</h1><div class="metrics">${stat('Matched','41','ok')}${stat('Review','3','amber')}${stat('Exceptions','1','danger')}</div>${card('Requires attention',row('UPI • 4187…4512','₹2,500 · Proof not bank verified',btn('Review','verify','small secondary'),'Pending')+row('Cash • CP-0139','₹2,000 · Awaiting deposit','', 'Pending'))}${btn('Allocate unmatched payment','allocate','block')}${btn('Import bank CSV (demo)','exports','block secondary')}`;break;
case 'gst':c=`<h1 class="headline">GST & tax summary</h1>${select('Reporting period','taxperiod',['Jul–Sep 2026','Oct 2026','FY 2026–27'],'Jul–Sep 2026')}${card('Tax overview',`<div class="align"><span>Taxable value</span><b>₹3,05,085</b></div><hr class="divider"><div class="align"><span>Calculated GST @18%</span><b>₹54,915</b></div><hr class="divider"><div class="align"><b>Illustrative total</b><b>₹3,60,000</b></div>`)}${card('Turnover tracker',`<div class="align"><b>₹6.1 lakh</b><span>Illustrative limit ₹20 lakh</span></div><div class="progress"><i style="width:30%"></i></div>`)}<div class="notice">Illustrative figures only. Configure tax status and review with a qualified CA before filing.</div>${btn('Export accounting summary','exports','block')}`;break;
case 'retention':c=`<h1 class="headline">Student retention</h1><div class="metrics">${stat('Active','82')}${stat('New','11','ok')}${stat('Left','3','danger')}</div>${card('6-month trend',lines([['May',53],['Jun',62],['Jul',65],['Aug',74],['Sep',86],['Oct',93]]))}${card('Student journey',row('Trials','12 this month')+row('Converted to paid','8 of 12 · 67%','', 'Paid')+row('Paused','4 students'))}`;break;
case 'target':c=`<h1 class="headline">Revenue targets</h1>${field('Monthly target ₹','goal',S.goal,'number')}${bb('Update target',`S.goal=Math.max(1,Number(v('goal')));toast('Revenue target updated')`,'block')}${card('Target progress',`<h1>${Math.round(S.collected/S.goal*100)}%</h1><div class="progress"><i style="width:${Math.min(100,S.collected/S.goal*100)}%"></i></div><p class="support">${fmt(S.collected)} collected of ${fmt(S.goal)}</p>`)}`;break;
case 'exports':c=`<h1 class="headline">Reports & exports</h1><p class="support">Explore reports or export the demo summary.</p>${[['Revenue overview','revenue'],['Overdue aging','aging'],['Batch profitability','profit'],['Payment reconciliation','reconcile'],['GST & tax summary','gst'],['Student retention','retention']].map(([name,id])=>`<button class="control" onclick="go('${id}')"><b>${name}</b><span>›</span></button>`).join('')}${bb('Download sample CSV',`downloadCSV()`,'block')}`;break;
case 'settings':c=`<h1 class="headline">Settings</h1>${card('Business profile',`<b>${h(S.business)}</b><p class="support">Hyderabad · Music academy</p>${btn('Edit profile','profile','small secondary')}`)}${[['Student migration','import'],['Fee plans','feeplan'],['Revenue targets','target'],['Reports & GST','gst'],['Parent portal','feeurl']].map(([x,y])=>`<button class="control" onclick="go('${y}')"><b>${x}</b><span>›</span></button>`).join('')}<div class="notice info">Payment gateway, SMS/WhatsApp, GST filing and bank reconciliation require production integrations.</div>`;break;
default:c=`<h1 class="headline">${h(S.screen)}</h1>${btn('Return home','home','block')}`}
return c}
const navs={admin:[['home','⌂','Home'],['calendar','▦','Calendar'],['student','♧','Students'],['money','▣','Money'],['settings','☰','More']],parent:[['parenthome','⌂','Home'],['family','▦','Fees'],['parenthistory','▣','Payments'],['parentschedule','◷','Schedule']],student:[['studenthome','⌂','Home'],['studentschedule','▦','Classes'],['studentattendance','☑','Attendance'],['studentprofile','♙','Profile']],teacher:[['teacherhome','⌂','Home'],['teachercalendar','▦','Classes'],['attendance','☑','Attendance']]};const noNav=['login','signup','otp','role','profile','import','addstudent','assign','feeplan','invoice','invite','feeurl','methods','upipending','proof','success','stillpending','studentactivate'];function render(){const info=inventory.find(x=>x[0]===S.screen)||[S.screen,'ClassPay',''];document.getElementById('screenLabel').textContent=info[1];document.getElementById('app').innerHTML=`<div class="system"><span>9:41</span><span>●●● ▰</span></div><div class="header">${S.history.length?`<button class="back" onclick="back()">‹</button>`:''}<strong>${S.screen==='login'?'ClassPay':info[1]}</strong><span class="push"></span><span class="avatar">${S.role==='admin'?'A':S.role==='teacher'?'R':S.role==='student'?'S':'N'}</span></div><div class="content">${screen()}</div>${noNav.includes(S.screen)?'':`<nav class="bottom">${(navs[S.role]||navs.parent).map(([id,ico,name])=>`<button class="${S.screen===id?'selected':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${name}</button>`).join('')}</nav>`}${S.notification?`<div class="toast">${h(S.notification)}</div>`:''}`;const groups=[...new Set(inventory.map(x=>x[2]))];document.getElementById('sidebar').innerHTML=`<div class="brand">Class<b>Pay</b></div><div class="subtitle">58-screen interactive concept · India</div><div class="role-row">${[['admin','Owner'],['parent','Parent'],['teacher','Teacher'],['student','Student']].map(([k,l])=>`<button class="${S.role===k?'active':''}" onclick="set('role','${k}');go('${k==='admin'?'home':k==='parent'?'parenthome':k==='teacher'?'teacherhome':'studenthome'}')">${l}</button>`).join('')}</div><div class="section-title">Walkthrough</div>${[['login','Start at login'],['profile','Academy setup'],['home','Owner dashboard'],['family','Parent billing'],['methods','Payment checkout'],['revenue','Reporting'],['studentactivate','Student activation'],['studenthome','Student portal']].map(([a,b])=>`<button class="jump" onclick="go('${a}')">${b}</button>`).join('')}${groups.map(g=>`<div class="section-title">${g}</div>${inventory.filter(x=>x[2]===g).map(x=>`<button class="jump ${x[0]===S.screen?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}`).join('')}`;document.getElementById('inspector').innerHTML=`<div class="eyebrow">Product journey</div><h2>${h(info[1])}</h2><p>Current screen: <span class="kbd">${h(S.screen)}</span></p><div class="flow"><b>Core flow</b><br>Login → Business setup → Student → Batch → Fee plan → Invoice → Invite → Parent bill → Payment → Receipt → Reports</div><div class="section-title">Scenario controls</div><button class="control" onclick="set('role','student');go('studentactivate')"><b>Test student activation</b><span>→</span></button><button class="control" onclick="S.studentAge='adult';set('role','student');go('studentfees')"><b>Test adult student payment</b><span>→</span></button><button class="control" onclick="set('role','parent');go('feeurl')"><b>Test no-install pay link</b><span>→</span></button><button class="control" onclick="set('role','admin');go('verify')"><b>Test proof approval</b><span>→</span></button><button class="control" onclick="set('role','admin');go('reconcile')"><b>Test reconciliation</b><span>→</span></button><button class="control" onclick="set('role','teacher');go('attendance')"><b>Test attendance</b><span>→</span></button><div class="section-title">Live demo state</div>${card('',`<div class="align"><span>Payment status</span>${statusTag()}</div><hr class="divider"><div class="align"><span>Proofs to verify</span><b>${S.pendingCount}</b></div><hr class="divider"><div class="align"><span>Collected</span><b>${fmt(S.collected)}</b></div>`)}<p><b>Prototype only.</b> All personal names, accounts and transactions are fictitious. Form changes are held in this browser session only.</p>`}
function downloadCSV(){const a=document.createElement('a');const rows=[['report','metric','value'],['Revenue','Collected',S.collected],['Revenue','Outstanding',42000],['Collections','Proofs awaiting verification',S.pendingCount],['Targets','Monthly target',S.goal]];a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='classpay-demo-report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();
</script></body></html>

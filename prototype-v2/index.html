<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClassPay – Full lifecycle prototype</title>
<style>
:root{--pri:#5046e5;--pri2:#eeeefe;--bg:#f6f7fc;--tx:#161b33;--mu:#6b7280;--bd:#e3e6f0;--ok:#15803d;--okb:#dcfce7;--wr:#b45309;--wrb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2}

.side h3{margin:0 0 4px;font-size:15px}.side h5{margin:12px 0 5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.side button{border:1px solid var(--bd);background:#fff;border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer;margin:2px 2px 2px 0}.side button:hover{background:var(--pri2)}
.side .st{display:flex;gap:7px;align-items:flex-start;padding:5px 6px;border-radius:7px;cursor:pointer;line-height:1.25}.side .st:hover{background:var(--pri2)}
.side .st i{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:10px;font-style:normal;color:#fff}
.side .st.done i{background:var(--ok);border-color:var(--ok)}.side .st small{display:block;color:var(--mu);font-size:11px}
.side .sc{display:grid;grid-template-columns:1fr 1fr;gap:2px}.side .sc button{text-align:left;margin:0;font-size:11px;padding:4px 6px}
.phone{width:392px;height:820px;flex:none;background:#0b0d1a;border-radius:42px;padding:10px;box-shadow:0 24px 60px #0005}
.scr{position:relative;width:100%;height:100%;background:var(--bg);border-radius:33px;overflow:hidden;display:flex;flex-direction:column}
.sb{display:flex;justify-content:space-between;padding:12px 22px 0;font-size:11px;font-weight:700;color:#6b7280;flex:none}
.hd{display:flex;gap:10px;align-items:flex-start;padding:10px 20px 10px;border-bottom:1px solid var(--bd);margin:0 14px;flex:none}
.hd h1{margin:0;font-size:22px;line-height:1.15}.hd .sub{font-size:12px;color:var(--mu);margin-top:3px}.bk{font-size:28px;line-height:.9;color:var(--pri);cursor:pointer;margin-left:-8px;padding:0 2px}

.btn{width:100%;border:0;background:var(--pri);color:#fff;padding:14px;border-radius:14px;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit}
.btn:disabled{background:#c7c9e8;cursor:not-allowed}.btn.sec{background:var(--pri2);color:var(--pri)}.btn.bad{background:var(--badb);color:var(--bad)}.btn.ok{background:var(--okb);color:var(--ok)}
.btn.sm{width:auto;padding:6px 11px;font-size:12px;border-radius:9px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}.card.c{cursor:pointer}.card.c:hover{border-color:var(--pri)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:13px}.row+.row{border-top:1px solid #f0f1f7}
.mu{color:var(--mu);font-size:12px}.big{font-size:24px;font-weight:800}.h4{font-weight:700;font-size:13.5px;margin:6px 0}

.b-ok{background:var(--okb);color:var(--ok)}.b-wr{background:var(--wrb);color:var(--wr)}.b-bad{background:var(--badb);color:var(--bad)}.b-in{background:var(--pri2);color:var(--pri)}.b-gr{background:#eef0f4;color:#4b5563}
.nav{display:flex;background:#fff;border-top:1px solid var(--bd);flex:none;padding-bottom:6px}.nav div{flex:1;text-align:center;font-size:10.5px;color:var(--mu);padding:8px 0 4px;cursor:pointer;position:relative}.nav div span{display:block;font-size:18px}.nav div.on{color:var(--pri);font-weight:700}
.nav .dot{position:absolute;top:3px;left:55%;background:var(--bad);color:#fff;border-radius:9px;font-size:9px;padding:1px 5px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chp{padding:7px 11px;border:1px solid var(--bd);border-radius:99px;font-size:12px;background:#fff;cursor:pointer}.chp.on{background:var(--pri);color:#fff;border-color:var(--pri)}

.demo{border:1.5px dashed #a5a8d8;background:#fafaff;border-radius:12px;padding:10px;margin:8px 0}.demo b{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:#6366a8;display:block;margin-bottom:6px}
.demo button{border:1px solid #c5c7ee;background:#fff;border-radius:8px;padding:6px 8px;font-size:11.5px;margin:2px;cursor:pointer}
.sheetbg{position:absolute;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:20}.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:16px 18px 20px;max-height:88%;overflow:auto}
.toast{pointer-events:none;position:absolute;left:16px;right:16px;bottom:84px;background:#161b33;color:#fff;padding:11px 14px;border-radius:12px;font-size:12.5px;z-index:30;box-shadow:0 8px 20px #0004}
.offl{background:#fef3c7;color:#92400e;font-size:11.5px;text-align:center;padding:5px;flex:none}

table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px 4px;border-bottom:1px solid #eef0f6;text-align:left}th{color:var(--mu);font-weight:600;font-size:11px}
.dbtn{display:none}
@media(max-width:940px){.side{position:fixed;z-index:50;left:8px;top:8px;bottom:8px;max-height:none;display:none;box-shadow:0 10px 40px #0006}.side.open{display:block}
 body{padding:0;display:block}.phone{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}.scr{border-radius:0}.dbtn{display:block;position:fixed;right:10px;top:8px;z-index:60;background:var(--pri);color:#fff;border:0;border-radius:99px;padding:7px 12px;font-size:12px}}
</style></head><body>
<button class="dbtn" onclick="document.querySelector('.side').classList.toggle('open')">⚙ Demo</button>
<div class="side" id="side"></div>
<div class="phone"><div class="scr" id="scr"></div></div>
<script>
/* ================= utilities ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>(n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const D=s=>new Date(s+'T00:00:00Z'),iso=d=>d.toISOString().slice(0,10);
const addD=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((D(a)-D(b))/864e5);
const fd=s=>{const d=D(s);return d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+d.getUTCFullYear()};
const fs=s=>{const d=D(s);return WD[d.getUTCDay()]+' '+d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const ym=s=>s.slice(0,7),mlabel=k=>MON[+k.slice(5,7)-1]+' '+k.slice(0,4);
const digits=s=>String(s).replace(/\D/g,'').slice(-10);
const sum=(a,f)=>a.reduce((x,y)=>x+(f?f(y):y),0);

/* ================= state ================= */
const LEGACY={m:{'2026-04':100000,'2026-05':105000,'2026-06':110000,'2026-07':110000,'2026-08':120000,'2026-09':130000,'2026-10':78000},
 ch:{'2026-10':{gw:45000,upi:23000,cash:10000}},bat:{'2026-10':{b1:22000,b2:30000,b3:26000}}};
const CSV=[
 {n:'Tara Kumar',g:'Rajesh Kumar',ph:'+91 98765 43010',b:'b2',lines:[['Oct tuition',2000,'2026-10-05','2026-10'],['Dance materials',500,'2026-10-05',null]]},
 {n:'Tara Kumar',g:'Rajesh Kumar',ph:'+91 98765 43010',b:'b2',lines:[],dup:true},
 {n:'Rohan Shah',g:'Anil Shah',ph:'+91 98765 43020',b:'b1',lines:[['Oct tuition + exam fee',2500,'2026-10-05','2026-10']]},
 {n:'Diya Mehta',g:'Neha Mehta',ph:'+91 98765 43030',b:'b1',lines:[['Sep tuition',2000,'2026-09-05','2026-09'],['Oct tuition',2000,'2026-10-05','2026-10']]},
 {n:'Sana Patel',g:'Kiran Patel',ph:'+91 98765 43040',b:'b1',lines:[['Oct tuition',2000,'2026-10-09','2026-10']]},
 {n:'Meera Rao',g:'Lata Rao',ph:'+91 98765 43050',b:'b3',lines:[],paused:'Travelling until Dec'},
 {n:'Kabir Thomas',g:'Jose Thomas',ph:'+91 98765 43060',b:'b3',lines:[['Oct tuition',2500,'2026-10-05','2026-10']]},
 {n:'Isha Nair',g:'Sunil Nair',ph:'+91 98765 43070',b:'b3',lines:[]},
 {n:'Dev Menon',g:'',ph:'',b:'b1',lines:[],bad:'Missing guardian phone'}];
const fresh=()=>({today:'2026-10-14',role:null,screen:'welcome',hist:[],p:{},f:{},offline:false,j:{},legacyOn:false,
 user:{name:'',phone:''},otp:{code:'274918',tries:0},
 inst:{name:'',cat:'Music / Dance / Coaching',city:'Hyderabad, Telangana',phone:'',vpa:'melody@upi',gst:{reg:true,gstin:'36ABCDE1234F1Z5',rate:18,incl:true,freq:'Quarterly',thr:2000000},target:120000,
  pol:{gateway:true,direct:true,cash:true,passFee:false,feePct:2}},
 batches:[{id:'b1',name:'Guitar Beginners',teacher:'Anil',days:[1,3],time:'5:00 PM',cap:15,fee:2000},{id:'b2',name:'Contemporary Dance',teacher:'Mia',days:[2,4],time:'6:00 PM',cap:12,fee:2000},{id:'b3',name:'Keyboard A2',teacher:'Anil',days:[6],time:'10:00 AM',cap:10,fee:2500}],
 costs:{b1:{t:10000,r:3500},b2:{t:8000,r:3000},b3:{t:6000,r:2000}},
 fams:[],studs:[],enrs:[],invs:[],pays:[],rcpts:[],cases:[],adjs:[],outbox:[],audit:[],sess:{},extra:[],credits:[],att:{},
 seq:{inv:100,rcpt:142,pay:42016,fam:0,stu:0,case:0,enr:0},link:{tok:'k7Q2m9xA',revoked:false,issued:false},imp:null,draft:null,al:null,evt:0});
let S=fresh();

/* ================= lookups & money rules ================= */
const fam=id=>S.fams.find(f=>f.id==id),stu=id=>S.studs.find(s=>s.id==id),bat=id=>S.batches.find(b=>b.id==id),inv=id=>S.invs.find(i=>i.id==id),pay=id=>S.pays.find(p=>p.id==id),enr=id=>S.enrs.find(e=>e.id==id);
const allocSum=p=>sum(p.alloc,a=>a.amt);
const paidOf=i=>sum(S.pays.filter(p=>p.state=='verified'),p=>sum(p.alloc.filter(a=>a.inv==i.id),a=>a.amt));
const adjOf=i=>sum(S.adjs.filter(a=>a.inv==i.id),a=>a.amt);
const bal=i=>Math.max(0,i.total-paidOf(i)-adjOf(i));
const PENDING=['pending_provider','pending_manual_review','needs_clarification'];
const pendingOn=i=>S.pays.find(p=>PENDING.includes(p.state)&&p.invs.includes(i.id));
const holdOn=i=>S.cases.find(c=>c.type=='hold'&&c.state=='open'&&c.invs.includes(i.id));
const overdueDays=i=>diff(S.today,i.due);
const istatus=i=>bal(i)<=0?'paid':pendingOn(i)?'pending':holdOn(i)?'hold':overdueDays(i)>0?'overdue':paidOf(i)>0?'partial':'due';
const openInvs=f=>S.invs.filter(i=>i.fam==f.id&&bal(i)>0).sort((a,b)=>a.due.localeCompare(b.due));
const famOut=f=>sum(openInvs(f),bal);
const creditOf=f=>sum(S.pays.filter(p=>p.fam==f.id&&p.state=='verified'&&p.channel!='credit'),p=>p.received-allocSum(p))-sum(S.pays.filter(p=>p.fam==f.id&&p.state=='verified'&&p.channel=='credit'),p=>p.received);
const activeProm=f=>S.cases.find(c=>c.type=='promise'&&c.fam==f.id&&c.state=='open'&&c.date>=S.today);
const sbadge=s=>({paid:'<span class="badge b-ok">Paid</span>',pending:'<span class="badge b-wr">Under review</span>',hold:'<span class="badge b-gr">On hold</span>',overdue:'<span class="badge b-bad">Overdue</span>',partial:'<span class="badge b-wr">Part paid</span>',due:'<span class="badge b-in">Due</span>'}[s]);
const log=t=>S.audit.unshift({d:S.today,who:S.role||'system',t});
const notify=(fid,ch,t)=>S.outbox.unshift({d:S.today,fam:fid,ch,t});
const guard=()=>{if(S.offline){toast('Offline – payment actions are disabled until you reconnect');return false}return true};

function mkInvoice(o){ // immutable snapshot at issue
 const g=S.inst.gst,net=sum(o.lines,l=>l[1])-(o.disc||0),total=g.reg&&!g.incl?Math.round(net*(1+g.rate/100)):net,taxable=g.reg?Math.round(total/(1+g.rate/100)):total;
 const i={id:'i'+(++S.seq.inv),no:'INV-2026-0'+S.seq.inv,stu:o.stu,fam:o.fam,enr:o.enr||null,bat:o.bat,period:o.period||null,lines:o.lines.map(l=>({d:l[0],amt:l[1]})),disc:o.disc||0,total,
  snap:{biz:S.inst.name,gstin:g.reg?g.gstin:'',rate:g.reg?g.rate:0,incl:g.incl,taxable,tax:total-taxable},issued:o.issued||S.today,due:o.due,src:o.src||'issued'};
 S.invs.push(i);return i}
function mkPay(o){const p={id:'PAY-'+(++S.seq.pay),fam:o.fam,amount:o.amount,received:0,channel:o.channel,method:o.method||'',ref:o.ref||'',state:o.state,invs:o.invs||[],alloc:[],rcpts:[],proof:!!o.proof,hint:o.hint||'',at:S.today,vat:null,by:o.by||S.role,dup:false,fee:o.fee||0,note:o.note||'',reason:'',evts:[]};
 S.pays.push(p);log(`${p.id} created (${p.channel}, ${p.state}) ${inr(p.amount)}`);return p}
function suggest(p,policy){const inv_=openInvs(fam(p.fam));let left=p.received-allocSum(p);const rows=inv_.map(i=>({inv:i.id,amt:0,max:bal(i)}));
 if(policy=='prop'){const base=rows.filter(r=>p.invs.includes(r.inv)||!p.invs.length),tot=sum(base,r=>r.max)||1;base.forEach(r=>{r.amt=Math.min(r.max,Math.floor(left*r.max/tot))});let rem=left-sum(rows,r=>r.amt);for(const r of base){const a=Math.min(rem,r.max-r.amt);r.amt+=a;rem-=a}}
 else{const order=policy=='sel'?[...rows.filter(r=>p.invs.includes(r.inv)),...rows.filter(r=>!p.invs.includes(r.inv))]:rows;for(const r of order){const a=Math.min(left,r.max);r.amt=a;left-=a}}
 return rows}
function issueReceipt(p,rows){const r={no:'R-2026-0'+(++S.seq.rcpt),pay:p.id,fam:p.fam,date:S.today,total:sum(rows,x=>x.amt),rows:rows.map(x=>({inv:x.inv,amt:x.amt})),method:p.method||p.channel,state:'valid'};
 S.rcpts.push(r);p.rcpts.push(r.no);S.j.receipt=1;const f=fam(p.fam);notify(f.id,'Email + WhatsApp share',`Receipt ${r.no} for ${inr(r.total)} sent to ${f.guardian}`);log(`Receipt ${r.no} issued for ${p.id}`);return r}
function applyAlloc(p,rows){const use=rows.filter(r=>r.amt>0);p.alloc.push(...use.map(r=>({inv:r.inv,amt:r.amt})));return issueReceipt(p,use)}
function verify(p,received){p.state='verified';p.received=received;p.vat=S.today;p.evts.push('verified');S.j.verify=1;log(`${p.id} verified ${inr(received)}`)}
function autoGateway(p){verify(p,p.amount);const rows=[];let left=p.amount;p.invs.map(inv).forEach(i=>{const a=Math.min(left,bal(i));rows.push({inv:i.id,amt:a});left-=a});return applyAlloc(p,rows)}
function reverse(p,reason){p.state='reversed';p.reason=reason;const cid='C-'+(++S.seq.case);S.rcpts.filter(r=>r.pay==p.id).forEach(r=>{r.state='reversed';r.corr=cid});log(`${p.id} reversed (${reason}); correction ${cid}`);notify(p.fam,'Email','Payment '+p.id+' was reversed: '+reason)}

/* ================= calendar / sessions ================= */
function sessionsOn(date){const dow=D(date).getUTCDay(),out=[];S.batches.forEach(b=>{if(b.days.includes(dow))out.push({id:b.id+'|'+date,bat:b.id,date,time:b.time})});S.extra.filter(e=>e.date==date).forEach(e=>out.push(e));return out}
const sstate=id=>S.sess[id]||{};
const members=b=>S.enrs.filter(e=>e.bat==b&&e.status=='active'&&stu(e.stu).status=='active');
function upcoming(n=14){const out=[];for(let k=0;k<n;k++){const d=addD(S.today,k);sessionsOn(d).forEach(s=>out.push(s))}return out}

/* ================= engine: billing / reminders / time ================= */
function planAmt(e){return e.plan.model=='split'?Math.round(e.plan.base/Math.max(1,members(e.bat).length)):e.plan.base}
function runBilling(){const per=ym(S.today);let made=0,skipped=0;
 S.enrs.forEach(e=>{if(e.status!='active'||stu(e.stu).status!='active')return;if(e.start>per+'-28'||(e.last&&e.last>=per)){skipped++;return}
  mkInvoice({stu:e.stu,fam:stu(e.stu).fam,enr:e.id,bat:e.bat,period:per,lines:[[`Tuition – ${bat(e.bat).name} (${MON[+per.slice(5)-1]})`,planAmt(e)]],disc:e.plan.disc||0,due:per+'-05',src:'cron'});e.last=per;made++});
 if(made||skipped)log(`Billing cycle ${per}: ${made} created, ${skipped} skipped (idempotent)`);if(made)S.j.cycle=1;return{made,skipped,per}}
function runReminders(manual){const sent=[],sup=[];
 S.fams.forEach(f=>{let inv_=openInvs(f).filter(i=>diff(i.due,S.today)<=3);if(!inv_.length)return;
  if(!manual&&!inv_.some(i=>[-3,0,1,7,14].includes(overdueDays(i))))return;
  const pr=activeProm(f);if(pr){sup.push([f.name,'Promise to pay until '+fd(pr.date)]);return}
  const free=inv_.filter(i=>!pendingOn(i)&&!holdOn(i));
  if(!free.length){sup.push([f.name,inv_.every(holdOn)?'Dispute hold':'Payment pending / under review']);return}
  if(f.lastRem==S.today){sup.push([f.name,'Frequency cap: already reminded today']);return}
  f.lastRem=S.today;const old=Math.max(...free.map(overdueDays)),t=old>0?`${inr(sum(free,bal))} is overdue (${old} days)`:`${inr(sum(free,bal))} falls due soon`;
  notify(f.id,'Push + email + share link',`Reminder to ${f.guardian}: ${t}. Pay: classpay.app/pay/${S.link.tok.slice(0,3)}••••`);sent.push([f.name,t]);if(old>14)f.escalate=true});
 if(sent.length)S.j.remind=1;return{sent,sup}}
function advance(n){let b=0,r=0;for(let k=0;k<n;k++){S.today=addD(S.today,1);
  S.cases.filter(c=>c.type=='promise'&&c.state=='open'&&c.date<S.today).forEach(c=>{if(famOut(fam(c.fam))>0){c.state='missed';log('Promise missed by '+fam(c.fam).name)}else c.state='kept'});
  if(S.today.slice(8)=='01'){b+=runBilling().made}r+=runReminders(false).sent.length}
 toast(`Now ${fd(S.today)} · ${b?b+' invoices generated · ':''}${r} automatic reminder(s)`);render()}

/* ================= onboarding / import / enrol actions ================= */
const A={};
A.start=()=>{S.role='owner';go('signup',{},1)};
A.skipDemo=()=>{ensure(4);S.role='owner';tab('ohome');toast('Demo data loaded – populated institute')};
A.sendOtp=()=>{const n=(S.f.su_name||'').trim(),m=digits(S.f.su_ph||'');if(!n||m.length<10){S.p.err='Enter your full name and a 10-digit mobile';return render()}

A.openLink=()=>{ensure(4);S.role='parent';S.hist=[];go(S.link.revoked?'linkDead':'link',{},1)};

const selInvs=f=>openInvs(f).filter(i=>!pendingOn(i)&&(S.sel||{})[i.id]!==false);
const feeFor=a=>S.inst.pol.passFee?Math.round(a*S.inst.pol.feePct/100):0;
A.toMethods=()=>{const f=famMain(),s=selInvs(f);if(!s.length)return toast('Select at least one invoice');S.cart={fam:f.id,invs:s.map(i=>i.id),amount:sum(s,bal)};go('methods')};
A.payGateway=m=>{if(!guard())return;const c=S.cart;const p=mkPay({fam:c.fam,amount:c.amount,channel:'gateway',method:m,state:'pending_provider',invs:c.invs,fee:feeFor(c.amount),by:'parent'});p.order='order_'+Math.random().toString(36).slice(2,8);S.j.pay=1;go('upiPending',{pid:p.id})};
A.checkStatus=pid=>{const p=pay(pid);if(p.state=='verified')return go('success',{pid});if(p.state=='failed')return render();toast('Still processing – please avoid paying twice. We will confirm via the provider.')};
A.webhook=(pid,kind)=>{const p=pay(pid);const id='evt_'+(++S.evt);
 if(kind=='redirect'){return toast('Browser returned "success" – IGNORED. Not paid until a signed provider event arrives.')}
 if(kind=='success'){if(p.state=='verified'){log(`Duplicate webhook ${id} for ${p.id} ignored (idempotent)`);return toast('Duplicate/out-of-order event ignored – no double credit')}
  p.evts.push('signature ok');autoGateway(p);return go('success',{pid})}
 if(kind=='replay'){if(p.state=='verified'){log(`Webhook replay ${id} ignored for ${p.id}`);return toast('Replayed webhook ignored (idempotency key already used)')}return toast('Nothing to replay yet')}
 if(kind=='failed'){if(p.state=='verified')return toast('Already verified – late failure event ignored');p.state='failed';log(p.id+' failed at provider');return render()}};

 const c=S.cart||{fam:famMain().id,invs:selInvs(famMain()).map(i=>i.id),amount:sum(selInvs(famMain()),bal)};
 const dup=S.pays.find(p=>p.ref==u&&!['rejected','failed'].includes(p.state));
 const p=mkPay({fam:c.fam,amount:+S.f.pf_amt||c.amount,channel:'upi_direct',method:'UPI',ref:u,state:'pending_manual_review',invs:c.invs,proof:true,by:'parent'});if(dup){p.dup=true;log('Duplicate UTR flagged on '+p.id)}

 if(amt!=p.amount){return go('issue',{pid:p.id,rec:amt})}
 verify(p,amt);S.al={pid:p.id,policy:'old',rows:suggest(p,'old')};go('allocate',{pid:p.id})};

A.issueAct=()=>{const p=pay(S.p.pid),a=S.f.is_act,rec=+S.f.is_rec;
 if(a=='Request clarification'){p.state='needs_clarification';p.reason=`Amount differs: claimed ${inr(p.amount)}, bank shows ${inr(rec)}. Please re-upload evidence.`;notify(p.fam,'Push + email',p.reason);log(p.id+' clarification requested');toast('Clarification sent; reminders paused while under review');return go('inbox',{},1)}
 if(a=='Accept received amount (partial)'){verify(p,rec);S.al={pid:p.id,policy:'old',rows:suggest(p,'old')};return go('allocate',{pid:p.id})}
 if(a=='Place invoice on dispute hold'){p.state='needs_clarification';S.cases.push({id:'C'+(++S.seq.case),type:'hold',state:'open',fam:p.fam,invs:p.invs,reason:'Amount dispute on '+p.id});log('Dispute hold placed');toast('Hold placed: dunning suppressed, principal preserved');return go('inbox',{},1)}
 p.state='rejected';p.reason='Rejected: '+a;log(p.id+' rejected');toast('Rejected with reason');go('inbox',{},1)};

 $('#alTot').textContent=inr(t);$('#alUn').textContent=inr(av-t);$('#alBtn').disabled=t>av||t<=0&&av>0&&false}

 S.cases.push({id:'C'+(++S.seq.case),type:'promise',state:'open',fam:f.id,date:S.f.pr_date,amount:+S.f.pr_amt||famOut(f),channel:S.f.pr_ch});S.j.remind=1;log(`Promise to pay by ${fd(S.f.pr_date)} recorded for ${f.name}`);S.p.err='';toast('Promise saved – routine reminders paused until '+fd(S.f.pr_date));go('inbox',{},1)};

A.reverse=no=>{const r=S.rcpts.find(x=>x.no==no);sheet(`<div class="h4">Reverse payment ${r.pay}</div><div class="mu">Receipt stays; a linked correction is created. Invoices reopen.</div><br><div class="fl"><label>Reason</label><select id="rvr"><option>Bounced / not credited</option><option>Duplicate payment</option><option>Refund requested</option></select></div><button class="btn bad" onclick="reverse(pay('${r.pay}'),$('#rvr').value);closeSheet();toast('Reversed. Correction ${'C-'}created');render()">Reverse payment</button>`)};

/* ================= helpers: nav, render, ui ================= */
function go(id,p={},resetHist){if(!resetHist&&S.screen!='welcome')S.hist.push({id:S.screen,p:S.p});else if(resetHist)S.hist=[];S.screen=id;S.p=p;render();$('.bd')&&($('.bd').scrollTop=0)}
function tab(id,p={}){S.hist=[];S.screen=id;S.p=p;render()}
function back(){const h=S.hist.pop();if(h){S.screen=h.id;S.p=h.p;render()}else tab(S.role=='parent'?'phome':S.role=='teacher'?'tday':'ohome')}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#scr').appendChild(e);setTimeout(()=>e.remove(),3200)}
function sheet(h){closeSheet();const e=document.createElement('div');e.className='sheetbg';e.id='sh';e.onclick=ev=>{if(ev.target==e)closeSheet()};e.innerHTML=`<div class="sheet">${h}</div>`;$('#scr').appendChild(e)}
const closeSheet=()=>{const e=$('#sh');e&&e.remove()};
function dl(name,rows){const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/plain'}));a.download=name;a.click();toast('Downloaded '+name)}
function fld(k,label,d='',o={}){if(S.f[k]===undefined)S.f[k]=d;const bad=o.bad?' bad':'';

 return `<div class="fl${bad}"><label>${label}</label><input ${o.type?`type="${o.type}"`:''} value="${esc(S.f[k])}" ${o.ro?'readonly':''} ${o.ph?`placeholder="${o.ph}"`:''} ${o.max?`maxlength="${o.max}"`:''} oninput="S.f['${k}']=this.value${o.on?';'+o.on:''}">${o.hint?`<div class="hint">${o.hint}</div>`:''}</div>`}

function mon(k){const L=S.legacyOn,lm=L?LEGACY.m[k]||0:0,ch=L&&LEGACY.ch[k]||{gw:0,upi:0,cash:0};
 const vp=S.pays.filter(p=>p.state=='verified'&&p.channel!='credit'&&(p.vat||'').slice(0,7)==k);
 const billed=lm+sum(S.invs.filter(i=>ym(i.issued)==k),i=>i.total);
 const collected=lm+sum(vp,p=>p.received);
 return{billed,collected,gw:ch.gw+sum(vp.filter(p=>p.channel=='gateway'),p=>p.received),upi:ch.upi+sum(vp.filter(p=>p.channel=='upi_direct'),p=>p.received),cash:ch.cash+sum(vp.filter(p=>['cash','bank'].includes(p.channel)),p=>p.received),vp}}

function aging(){const b={'1–7 days':[],'8–30 days':[],'31+ days':[]};S.invs.filter(i=>bal(i)>0&&overdueDays(i)>0).forEach(i=>{const d=overdueDays(i);b[d<=7?'1–7 days':d<=30?'8–30 days':'31+ days'].push(i)});return b}
function batchInc(bid,k,accr){const L=S.legacyOn&&LEGACY.bat[k]&&LEGACY.bat[k][bid]||0;

function gstPeriod(sel){const y=ym(S.today);const P={'Q2 Jul–Sep 2026':['2026-07','2026-09'],'Q3 Oct–Dec 2026 (so far)':['2026-10','2026-12'],'This month':[y,y],'FY 2026-27 to date':['2026-04','2027-03']};const[a,b]=P[sel]||P['Q2 Jul–Sep 2026'];
 let c=0;for(let m=0;m<12;m++){const k=iso(new Date(Date.UTC(2026,3+m,1))).slice(0,7);if(k>=a&&k<=b)c+=mon(k).collected}return c}

/* ================= journey, ensure, jump ================= */
function ensure(n){if(!S.j.otp){S.user=S.user.name?S.user:{name:'Anita Sharma',phone:'+91 98765 43210'};S.inst.name=S.inst.name||'Melody Music Academy';S.j.otp=1}
 if(n>=1&&!S.j.biz){S.inst.name=S.inst.name||'Melody Music Academy';S.j.biz=1}
 if(n>=2&&!S.j.import){const prev=S.role;S.role='owner';A.doImport('merge');S.role=prev;S.hist=[]}
 if(n>=3&&!S.j.invoice){S.role='owner';Object.assign(S.f,{as_n:['Aarav Kumar'].find(n=>!S.studs.find(s=>s.name==n))||'Kavya Kumar',as_age:'Minor – guardian required',as_g:'Rajesh Kumar',as_gph:'+91 98765 43010',sg_b:'b1',sg_start:'2026-11-01',fp_model:'Monthly per student',fp_base:2000,fp_disc:200,fp_due:'2026-11-05'});
  A.addNext();A.assignNext();A.feeNext();A.createInvoice();S.f={};S.hist=[]}
 if(n>=4&&!S.j.invite){S.link.issued=true;S.j.invite=1}
 if(S.draft&&S.draft.famId)S.famId=S.draft.famId}
function ensureProof(){ensure(4);if(!S.pays.some(p=>p.state=='pending_manual_review'))mkPay({fam:S.fams[0].id,amount:2500,channel:'upi_direct',method:'UPI',ref:'4187'+Math.floor(1e8*Math.random()),state:'pending_manual_review',invs:openInvs(S.fams[0]).map(i=>i.id),proof:true,by:'parent'})}
const SCREENS=[['01','signup','owner',0,'Create account'],['02','otp','owner',0,'Verify OTP'],['03','role','owner',0,'Choose role'],['04','biz','owner',0,'Business profile'],['05','import','owner',1,'Import students'],['06','addstu','owner',2,'Add student'],['07','assign','owner',2,'Assign student'],['08','feeplan','owner',2,'Fee plan'],['09','invprev','owner',2,'Invoice preview'],['10','invite','owner',3,'Invite parent'],['11','inbox','owner',4,'Collections inbox'],['12','approve','owner',4,'Approve payment'],['13','issue','owner',4,'Payment issue'],['14','allocate','owner',4,'Allocate payment'],['15','cash','owner',4,'Cash / bank'],['16','promise','owner',4,'Promise to pay'],['17','receipt','owner',4,'Receipt'],['18','link','parent',4,'Open fee link'],['19','famBill','parent',4,'Family bill'],['20','methods','parent',4,'Payment methods'],['21','upiPending','parent',4,'UPI pending'],['22','proof','parent',4,'Upload proof'],['23','success','parent',4,'Success'],['24','stillPending','parent',4,'Still pending'],['25','revenue','owner',4,'Revenue'],['26','aging','owner',4,'Overdue aging'],['27','profit','owner',4,'Profitability'],['28','recon','owner',4,'Reconciliation'],['29','gst','owner',4,'GST summary'],['30','retention','owner',4,'Retention'],['31','tday','teacher',4,'Attendance'],['32','makeup','owner',4,'Make-up credit']];
function jump(num){const[,id,role,lv]=SCREENS.find(s=>s[0]==num);S.f={};S.p={};S.hist=[];S.cart=null;S.al=null;
 if(lv>=1||num>'03')ensure(lv);else if(num!='01'){S.user=S.user.name?S.user:{name:'Anita Sharma',phone:'+91 98765 43210'}}
 S.role=role;const p={};
 if(['approve','issue'].includes(id)){ensureProof();const x=S.pays.find(p=>p.state=='pending_manual_review');p.pid=x.id;if(id=='issue')p.rec=Math.max(0,x.amount-500)}
 if(id=='allocate'){ensure(4);let x=S.pays.find(q=>q.state=='verified'&&q.channel!='credit'&&q.received-allocSum(q)>0);if(!x){const f=S.fams[0];x=mkPay({fam:f.id,amount:famOut(f),channel:'cash',method:'Cash',state:'verified',invs:openInvs(f).map(i=>i.id),by:'owner'});x.received=x.amount;x.vat=S.today}S.al={pid:x.id,policy:'old',rows:suggest(x,'old')};p.pid=x.id}
 if(id=='receipt'){ensure(4);if(!S.rcpts.length){const f=S.fams.find(f=>S.studs.some(s=>s.name=='Aarav Kumar'&&s.fam==f.id))||S.fams[0],i=openInvs(f)[0];const x=mkPay({fam:f.id,amount:bal(i),channel:'gateway',method:'UPI',state:'pending_provider',invs:[i.id],by:'parent'});autoGateway(x)}p.no=S.rcpts[S.rcpts.length-1].no}
 if(['link','famBill','methods','upiPending','success','proof','stillPending'].includes(id)){ensure(4);S.famId=S.draft&&S.draft.famId||S.fams[0].id;const f0=famMain();if(!openInvs(f0).some(i=>!pendingOn(i))){const s0=S.studs.find(x=>x.fam==f0.id);mkInvoice({stu:s0.id,fam:f0.id,bat:S.enrs.find(e=>e.stu==s0.id).bat,lines:[['Workshop fee',500]],due:addD(S.today,7)});S.sel={}}}
 if(id=='link'||id=='famBill'){S.famId=S.draft&&S.draft.famId||S.fams[0].id}
 if(id=='methods'){S.famId=S.draft&&S.draft.famId;const f=famMain();S.cart={fam:f.id,invs:openInvs(f).map(i=>i.id),amount:sum(openInvs(f),bal)}}
 if(['upiPending','success'].includes(id)){const f=famMain(),iv=openInvs(f).filter(i=>!pendingOn(i));const x=mkPay({fam:f.id,amount:sum(iv,bal),channel:'gateway',method:'UPI',state:'pending_provider',invs:iv.map(i=>i.id),by:'parent'});p.pid=x.id;if(id=='success'){autoGateway(x)}}
 if(id=='proof'){const f=famMain();S.cart={fam:f.id,invs:openInvs(f).map(i=>i.id),amount:sum(openInvs(f),bal)}}
 if(id=='stillPending'){const f=famMain();const x=mkPay({fam:f.id,amount:sum(openInvs(f),bal),channel:'upi_direct',method:'UPI',ref:'4187098645'+Math.floor(10+Math.random()*89),state:'pending_manual_review',invs:openInvs(f).map(i=>i.id),proof:true,by:'parent'});p.pid=x.id}
 if(id=='makeup'){const s=upcoming(14).find(x=>!x.makeup&&D(x.date).getUTCDay()==1&&x.date>S.today)||upcoming(14)[1];p.sid=s.id}
 S.screen=id;S.p=p;render();closeSide()}
const STEPS=[['otp','Sign up &amp; verify OTP','S01–03','signup'],['biz','Business &amp; GST profile','S04','biz'],['import','Import students (reversible)','S05','import'],['invoice','Enrol student, fee plan, invoice','S06–09','addstu'],['invite','Invite parent (secure link)','S10','invite'],['pay','Parent pays: gateway or UPI proof','S18–24','link'],['verify','Owner verifies &amp; allocates','S11–15','inbox'],['receipt','Receipt issued &amp; shareable','S17','receipt'],['remind','Reminders, promises, holds','S11,16','inbox'],['cycle','Next billing cycle (cron)','Billing','cycle'],['attend','Attendance (teacher)','S31','tday'],['makeup','Cancel + make-up credits','S32','calendar'],['report','Reports &amp; GST','S25–30','reports']];
function stepGo(k,t){const lv={otp:0,biz:0,import:1,invoice:2,invite:3};if(lv[k]!==undefined&&k!='otp'&&k!='biz'){}
 if(k=='otp'){reset(true);S.role='owner';return go('signup',{},1)}
 if(k=='biz'){S.role='owner';ensure(0);return go('biz',{},1)}
 if(k=='import'){S.role='owner';ensure(1);return go('import',{},1)}
 if(k=='invoice'){S.role='owner';ensure(2);S.f={};S.draft=null;return go('addstu',{},1)}
 if(k=='invite'){ensure(3);S.role='owner';return go('invite',{},1)}
 if(k=='pay'){ensure(4);S.role='parent';S.famId=S.draft&&S.draft.famId||S.fams[0].id;S.sel={};return go('link',{},1)}
 if(k=='verify'){ensureProof();S.role='owner';return tab('inbox')}
 if(k=='receipt')return jump('17');
 if(k=='remind'){ensure(4);S.role='owner';return tab('inbox')}
 if(k=='cycle'){ensure(4);S.role='owner';return go('cycle',{},1)}
 if(k=='attend')return jump('31');
 if(k=='makeup'){ensure(4);S.role='owner';return tab('calendar')}
 if(k=='report'){ensure(4);S.role='owner';return tab('reports')}}
function side(){const r=S.role;$('#side').innerHTML=`<h3>ClassPay · full lifecycle</h3><div class="mu">Everything in the phone is live: actions change shared data that every role sees. Today in the demo: <b>${fd(S.today)}</b></div>
 <h5>Lifecycle journey</h5>${STEPS.map(([k,t,s])=>`<div class="st ${S.j[k]?'done':''}" onclick="stepGo('${k}');closeSide()"><i>${S.j[k]?'✓':''}</i><div>${t}<small>${s}</small></div></div>`).join('')}
 <h5>Switch role (same data)</h5><button onclick="swRole('owner')">Owner${r=='owner'?' ●':''}</button><button onclick="swRole('parent')">Parent${r=='parent'?' ●':''}</button><button onclick="swRole('teacher')">Teacher${r=='teacher'?' ●':''}</button>
 <h5>Time &amp; connectivity</h5><button onclick="advance(1)">+1 day</button><button onclick="advance(7)">+7 days</button><button onclick="advance(Math.max(1,diff('2026-11-01',S.today)))">→ 1 Nov</button><button onclick="S.offline=!S.offline;render()">${S.offline?'Go online':'Go offline'}</button>
 <h5>All 32 designed screens</h5><div class="sc">${SCREENS.map(s=>`<button onclick="jump('${s[0]}')">${s[0]} ${s[4]}</button>`).join('')}</div>
 <h5>Data</h5><button onclick="S.role=S.role||'owner';go('outbox')">Messages &amp; audit</button><button onclick="reset()">Reset all</button>`}
function swRole(r){ensure(4);S.role=r;S.hist=[];S.famId=S.famId||(S.draft&&S.draft.famId)||S.fams[0].id;tab(r=='parent'?'phome':r=='teacher'?'tday':'ohome');closeSide()}
const closeSide=()=>$('#side').classList.remove('open');
function reset(soft){S=fresh();if(!soft)render();else render()}
function render(){const f=R[S.screen];$('#scr').innerHTML=f?f():R.welcome();side();if(S.screen=='allocate'&&S.al){}}
window.addEventListener('keydown',e=>{if(e.key=='Escape')closeSheet()});
render();
</script></body></html>

# Supabase project configuration (local development via `supabase start`)
project_id = "classpay"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/login", "http://localhost:5173/reset"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Keep ON in production: invited staff/guardians are linked to their record by VERIFIED email, so unverified addresses must not sign in.
enable_confirmations = true
minimum_password_length = 8

[storage]
file_size_limit = "5MiB"

# Parent links and webhooks are called without a user session; each function validates its own credential.
[functions.create-payment]
verify_jwt = false
[functions.submit-proof]
verify_jwt = false
[functions.payment-webhook]
verify_jwt = false
[functions.mock-provider]
verify_jwt = false

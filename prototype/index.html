<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClassPay Prototype</title>
<style>
:root{--pri:#4f46e5;--pri2:#eef2ff;--ok:#16a34a;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#dc2626;--badbg:#fee2e2;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--bg:#f3f4f6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#e5e7eb;color:var(--tx);display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:20px;min-height:100vh}
.side{width:260px;background:#fff;border-radius:12px;padding:16px;font-size:13px;position:sticky;top:20px}
.side h3{margin:0 0 8px;font-size:15px}.side button{display:block;width:100%;text-align:left;margin:3px 0;padding:6px 8px;border:1px solid var(--bd);background:#fff;border-radius:6px;cursor:pointer;font-size:13px}
.side button:hover{background:var(--pri2)}.side small{color:var(--mu);display:block;margin:8px 0}
.phone{width:390px;height:790px;background:#000;border-radius:38px;padding:10px;box-shadow:0 20px 50px #0004;flex:none}
.scr{background:var(--bg);width:100%;height:100%;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:26px;background:#fff;font-size:11px;display:flex;justify-content:space-between;padding:6px 18px 0;color:var(--mu)}
.top{background:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;font-weight:600;border-bottom:1px solid var(--bd)}
.top .back{cursor:pointer;font-size:20px;color:var(--pri)}.top .sp{flex:1}
.body{flex:1;overflow:auto;padding:14px}
.nav{display:flex;background:#fff;border-top:1px solid var(--bd)}
.nav div{flex:1;text-align:center;padding:8px 0 10px;font-size:11px;color:var(--mu);cursor:pointer}.nav div.on{color:var(--pri);font-weight:700}.nav div span{display:block;font-size:18px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid var(--bd)}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--pri)}
h4{margin:0 0 8px;font-size:14px}.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:13px}.row:last-child{border:0}
.mu{color:var(--mu);font-size:12px}.big{font-size:22px;font-weight:700}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;background:var(--pri);color:#fff;padding:11px 14px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;width:100%}
.btn.sm{width:auto;padding:6px 10px;font-size:12px;border-radius:8px}.btn.alt{background:var(--pri2);color:var(--pri)}.btn.gr{background:var(--okbg);color:var(--ok)}.btn.rd{background:var(--badbg);color:var(--bad)}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.b-paid{background:var(--okbg);color:var(--ok)}.b-pending{background:var(--warnbg);color:var(--warn)}.b-overdue{background:var(--badbg);color:var(--bad)}.b-due{background:var(--pri2);color:var(--pri)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:14px;margin:4px 0 10px;background:#fff}
label{font-size:12px;color:var(--mu)}.chips{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 10px}.chip{padding:6px 9px;border:1px solid var(--bd);border-radius:99px;font-size:12px;background:#fff;cursor:pointer}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sheetbg{position:absolute;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:5}.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px;max-height:85%;overflow:auto}
.toast{position:absolute;left:16px;right:16px;bottom:70px;background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:9}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs div{flex:1;text-align:center;padding:7px;border-radius:8px;background:#fff;border:1px solid var(--bd);font-size:12px;cursor:pointer}.tabs div.on{background:var(--pri);color:#fff}
.hero{text-align:center;padding:40px 10px 10px}.hero h1{color:var(--pri);margin:6px 0}
.rcpt{border:1px dashed var(--mu);padding:12px;border-radius:8px;font-size:13px;background:#fff}
.shot{height:120px;background:repeating-linear-gradient(45deg,#eef2ff,#eef2ff 10px,#e0e7ff 10px,#e0e7ff 20px);display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--pri);font-size:13px}
@media(max-width:700px){body{padding:0}.side{display:none}.phone{width:100vw;height:100vh;border-radius:0;padding:0}.scr{border-radius:0}}
</style></head><body>
<div class="side"><h3>ClassPay prototype</h3><small>Clickable demo with dummy data. Everything works in the phone: mark cash, approve proofs, send reminders, pay as a parent. Login OTP: <b>1234</b>.</small>
<b>Jump to</b>
<button onclick="login('admin')">Admin: dashboard</button><button onclick="login('admin');go('batches')">Admin: batches</button><button onclick="login('admin');go('newbatch')">Admin: new batch</button><button onclick="login('admin');go('verify')">Admin: verify proofs</button><button onclick="login('admin');go('reports')">Admin: reports</button><button onclick="login('admin');go('gst')">Admin: GST</button><button onclick="login('admin');go('settings')">Admin: settings</button>
<button onclick="login('parent')">Parent: home</button><button onclick="login('parent');go('pay')">Parent: pay</button><button onclick="login('teacher')">Teacher: today</button><button onclick="go('login')">Login screen</button><button onclick="reset()">Reset demo data</button></div>
<div class="phone"><div class="scr" id="scr"></div></div>
<script>
const $=s=>document.querySelector(s);
const fresh=()=>({role:null,screen:'login',p:{},child:'s1',rcpt:143,base:78000,tab:'Schedule',
 batches:[{id:'g1',name:'Guitar Beginners',teacher:'Anil',days:'Mon Wed',time:'5–6pm',fee:2000,cap:15},{id:'k2',name:'Keyboard A2',teacher:'Mia',days:'Tue Thu',time:'6–7pm',fee:2500,cap:10},{id:'v1',name:'Vocals',teacher:'Mia',days:'Sat',time:'10–11am',fee:1800,cap:12}],
 students:[{id:'s1',name:'Aarav K.',b:'g1',st:'overdue',d:6},{id:'s2',name:'Diya M.',b:'g1',st:'overdue',d:3},{id:'s3',name:'Rohan S.',b:'g1',st:'pending',d:0},{id:'s4',name:'Sana P.',b:'g1',st:'due',d:0},{id:'s5',name:'Meera R.',b:'k2',st:'paid',d:0,mode:'UPI'},{id:'s6',name:'Kabir T.',b:'k2',st:'overdue',d:9},{id:'s7',name:'Isha N.',b:'v1',st:'paid',d:0,mode:'Cash'},{id:'s8',name:'Tara K.',b:'k2',st:'paid',d:0,mode:'UPI'}],
 receipts:[{n:'R-0143',s:'s1',m:'Sep 2026',a:2000,mode:'UPI'},{n:'R-0098',s:'s1',m:'Aug 2026',a:2000,mode:'Cash'}],
 target:120000,reminded:{}});
let S=fresh();
const bat=id=>S.batches.find(b=>b.id==id), stu=id=>S.students.find(s=>s.id==id), amt=s=>bat(s.b).fee;
const inr=n=>'₹'+n.toLocaleString('en-IN');
const badge=s=>({paid:'<span class="badge b-paid">Paid</span>',pending:'<span class="badge b-pending">Pending verify</span>',overdue:`<span class="badge b-overdue">Overdue ${s.d}d</span>`,due:'<span class="badge b-due">Due in 2d</span>'}[s.st]);
const collected=()=>S.base+S.students.filter(s=>s.paidNow).reduce((a,s)=>a+amt(s),0);
const outstanding=()=>S.students.filter(s=>s.st!='paid').reduce((a,s)=>a+amt(s),0);
function go(n,p={}){S.screen=n;S.p=p;render()}
function login(r){S.role=r;S.screen=r=='admin'?'dash':r=='parent'?'phome':'tday';render()}
function reset(){S=fresh();render()}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#scr').appendChild(e);setTimeout(()=>e.remove(),2200)}
function sheet(h){const e=document.createElement('div');e.className='sheetbg';e.id='sh';e.onclick=ev=>{if(ev.target==e)e.remove()};e.innerHTML=`<div class="sheet">${h}</div>`;$('#scr').appendChild(e)}
const closeSheet=()=>{const e=$('#sh');e&&e.remove()};
const topbar=(t,back,right='')=>`<div class="top">${back?`<span class="back" onclick="go('${back}')">‹</span>`:''}<span>${t}</span><span class="sp"></span>${right}</div>`;
const navs={admin:[['dash','🏠','Home'],['batches','📚','Batches'],['payments','💳','Payments'],['reports','📊','Reports']],parent:[['phome','🏠','Home'],['psched','📅','Schedule'],['pay','💳','Pay'],['prcpt','🧾','Receipts']],teacher:[['tday','📅','Today'],['tbatches','📚','Batches']]};
const nav=()=>`<div class="nav">${navs[S.role].map(([k,i,l])=>`<div class="${S.screen==k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</div>`).join('')}</div>`;
const shell=(t,body,o={})=>`<div class="status"><span>9:41</span><span>5G ▮▮▮</span></div>${topbar(t,o.back,o.right)}<div class="body">${body}</div>${o.nonav?'':nav()}`;

function remind(id){S.reminded[id]=1;toast('Reminder sent to parent (push + SMS)');}
function remindAll(){const l=S.students.filter(s=>s.st=='overdue');l.forEach(s=>S.reminded[s.id]=1);toast(`Reminders sent to ${l.length} parents`);}
function markPaid(id,mode,send){const s=stu(id);s.st='paid';s.paidNow=1;s.mode=mode;const n='R-0'+(++S.rcpt);S.receipts.unshift({n,s:id,m:'Oct 2026',a:amt(s),mode});closeSheet();toast(`Paid (${mode}). Receipt ${n}${send?' sent':''}`);render()}
function cashSheet(id){const s=stu(id);sheet(`<h4>Record payment – ${s.name}</h4><label>Amount</label><input value="${amt(s)}"><label>Mode</label><select id="md"><option>Cash</option><option>Cheque</option><option>Bank transfer</option><option>UPI (direct)</option></select><label>Note</label><input placeholder="e.g. paid to Anil"><label><input type="checkbox" checked style="width:auto;margin-right:6px">Send receipt to parent</label><br><br><button class="btn" onclick="markPaid('${id}',$('#md').value,1)">Save & issue receipt</button>`)}
function approve(id,ok){const s=stu(id);if(ok)markPaid(id,'UPI (proof)',1);else{s.st='overdue';s.d=s.d||1;toast('Proof rejected, parent notified');render()}}

const R={
login:()=>`<div class="status"><span>9:41</span><span>5G ▮▮▮</span></div><div class="body"><div class="hero"><div style="font-size:48px">♪</div><h1>ClassPay</h1><p class="mu">Classes, fees & receipts in one place</p></div>
<div class="card"><label>Mobile number</label><input value="+91 98765 43210"><button class="btn" onclick="go('otp')">Send OTP</button></div><p class="mu" style="text-align:center">Accounts are created by your institute admin.</p></div>`,
otp:()=>`<div class="status"><span>9:41</span><span>5G ▮▮▮</span></div>${topbar('Verify OTP','login')}<div class="body"><div class="card"><label>Enter 4-digit code (demo: 1234)</label><input id="otp" value="1234" maxlength="4" style="font-size:24px;letter-spacing:10px;text-align:center"><label>Sign in as (demo role)</label><div class="chips" id="rl">${['admin','parent','teacher'].map((r,i)=>`<span class="chip ${i?'':'on'}" onclick="document.querySelectorAll('#rl .chip').forEach(c=>c.classList.remove('on'));this.classList.add('on');this.dataset.r='1'" data-role="${r}">${r}</span>`).join('')}</div><button class="btn" onclick="login(document.querySelector('#rl .on').dataset.role)">Verify & continue</button></div></div>`,
dash:()=>{const c=collected(),pct=Math.round(c/S.target*100),od=S.students.filter(s=>s.st=='overdue'),pe=S.students.filter(s=>s.st=='pending').length,gap=Math.round(S.target*.75-c);
return shell('Sharma Music Class',`<div class="card"><div class="mu">October target ${inr(S.target)}</div><div class="big">${inr(c)}</div><div class="bar"><i style="width:${pct}%"></i></div><span class="badge ${gap>0?'b-pending':'b-paid'}">${pct}% · ${gap>0?'Behind pace by '+inr(gap):'On track'}</span></div>
<div class="grid"><div class="card"><div class="mu">Outstanding</div><div class="big">${inr(outstanding())}</div></div><div class="card click" onclick="go('verify')"><div class="mu">Pending verify</div><div class="big">${pe}</div><span class="mu">Review ›</span></div></div>
<div class="card"><h4>Overdue (${od.length}) <button class="btn sm alt" style="float:right" onclick="remindAll()">Remind all</button></h4>${od.map(s=>`<div class="row"><div onclick="go('student',{id:'${s.id}'})" style="cursor:pointer"><b>${s.name}</b><div class="mu">${bat(s.b).name} · ${inr(amt(s))} · ${s.d}d</div></div><div><button class="btn sm alt" onclick="remind('${s.id}')">${S.reminded[s.id]?'✓ Sent':'⏰'}</button> <button class="btn sm gr" onclick="cashSheet('${s.id}')">Cash</button></div></div>`).join('')||'<div class="mu">Nobody is overdue 🎉</div>'}</div>
<div class="card"><h4>Today's classes</h4><div class="row"><span>5:00pm Guitar Beginners</span><span class="mu">Anil</span></div><div class="row"><span>6:00pm Keyboard A2</span><span class="mu">Mia</span></div></div>`,{right:'<span onclick="go(\'settings\')" style="cursor:pointer">⚙️</span>'})},
batches:()=>shell('Batches',`<button class="btn" onclick="go('newbatch')">+ New batch</button><br><br>${S.batches.map(b=>{const n=S.students.filter(s=>s.b==b.id),o=n.filter(s=>s.st=='overdue').length;return`<div class="card click" onclick="go('batch',{id:'${b.id}'})"><b>${b.name}</b> <span class="mu">${n.length}/${b.cap}</span><div class="mu">${b.days} ${b.time} · ${inr(b.fee)}/mo · ${b.teacher}</div>${o?`<span class="badge b-overdue">${o} overdue</span>`:'<span class="badge b-paid">All clear</span>'}</div>`}).join('')}`),
newbatch:()=>shell('New batch',`<div class="card"><label>Name</label><input id="nn" value="Drums Beginners"><label>Teacher</label><select><option>Anil</option><option>Mia</option></select><label>Days</label><div class="chips">${['M','T','W','T','F','S','S'].map((d,i)=>`<span class="chip ${[0,2].includes(i)?'on':''}" onclick="this.classList.toggle('on')">${d}</span>`).join('')}</div><label>Time</label><input value="4:00pm – 5:00pm"><label>Capacity</label><input value="10"><label>Fee type</label><div class="chips"><span class="chip on" onclick="this.parentNode.children[1].classList.remove('on');this.classList.add('on')">Per student</span><span class="chip" onclick="this.parentNode.children[0].classList.remove('on');this.classList.add('on')">Per batch (split)</span></div><label>Amount (monthly)</label><input id="nf" value="2200"><label>Due day of month / grace days</label><div class="grid"><input value="5"><input value="3"></div><button class="btn" onclick="S.batches.push({id:'n'+S.batches.length,name:$('#nn').value,teacher:'Anil',days:'Mon Wed',time:'4–5pm',fee:+$('#nf').value,cap:10});toast('Batch created');go('batches')">Create batch</button></div>`,{back:'batches',nonav:1}),
batch:()=>{const b=bat(S.p.id),n=S.students.filter(s=>s.b==b.id);return shell(b.name,`<div class="card"><div class="mu">${b.days} ${b.time} · ${b.teacher} · Room 2 · ${inr(b.fee)}/mo</div><br><div class="grid"><button class="btn alt" onclick="toast('Session cancelled, students notified')">Cancel next</button><button class="btn alt" onclick="toast('Reschedule picker (prototype)')">Reschedule</button></div></div>
<div class="card"><h4>Students (${n.length}) <button class="btn sm" style="float:right" onclick="toast('Add student picker (prototype)')">+ Add</button></h4>${n.map(s=>`<div class="row" onclick="go('student',{id:'${s.id}'})" style="cursor:pointer"><span>${s.name}</span>${badge(s)}</div>`).join('')}</div>`,{back:'batches'})},
student:()=>{const s=stu(S.p.id),h=S.receipts.filter(r=>r.s==s.id);return shell(s.name,`<div class="card"><div class="mu">Parent: Mr. Kumar · 98xxxxxx10<br>Batch: ${bat(s.b).name}</div></div>
<div class="card"><div class="row"><b>Oct 2026 · ${inr(amt(s))}</b>${badge(s)}</div>${s.st=='paid'?`<div class="mu">Paid via ${s.mode}</div>`:`<div class="grid"><button class="btn gr" onclick="cashSheet('${s.id}')">Mark paid</button><button class="btn alt" onclick="remind('${s.id}')">Remind</button></div><br><button class="btn alt" onclick="toast('Discount sheet (prototype)')">Add discount</button>`}</div>
<div class="card"><h4>History</h4>${h.map(r=>`<div class="row" onclick="go('receipt',{n:'${r.n}'})" style="cursor:pointer"><span>${r.m} · ${inr(r.a)}<div class="mu">${r.n} · ${r.mode}</div></span><span class="badge b-paid">Paid ›</span></div>`).join('')||'<div class="mu">No receipts yet</div>'}</div>`,{back:'dash'})},
payments:()=>shell('Payments',`<div class="tabs"><div class="on">All</div><div onclick="go('verify')">Pending ✓ (${S.students.filter(s=>s.st=='pending').length})</div></div>${S.students.map(s=>`<div class="card click" onclick="go('student',{id:'${s.id}'})"><div class="row" style="border:0;padding:0"><span><b>${s.name}</b><div class="mu">${bat(s.b).name} · ${inr(amt(s))}</div></span>${badge(s)}</div></div>`).join('')}`),
verify:()=>{const l=S.students.filter(s=>s.st=='pending');return shell('Verify payments',l.map(s=>`<div class="card"><b>${s.name}</b> · ${inr(amt(s))}<div class="mu">UTR 4021xxxx88 · 14 Oct</div><div class="shot">🖼 payment screenshot</div><br><div class="grid"><button class="btn rd" onclick="approve('${s.id}',0)">Reject</button><button class="btn gr" onclick="approve('${s.id}',1)">Approve ✓</button></div></div>`).join('')||'<div class="card mu">Nothing pending 🎉</div>',{back:'dash',nonav:1})},
reports:()=>{const c=collected(),mx=Math.max(...S.batches.map(b=>b.fee*S.students.filter(s=>s.b==b.id).length));return shell('Reports',`<div class="card"><h4>Revenue by batch (expected)</h4>${S.batches.map(b=>{const v=b.fee*S.students.filter(s=>s.b==b.id).length;return`<div class="mu">${b.name} ${inr(v)}</div><div class="bar"><i style="width:${v/mx*100}%"></i></div>`}).join('')}</div>
<div class="card"><h4>By payment mode</h4><div class="row"><span>UPI</span><b>60%</b></div><div class="row"><span>Cash</span><b>30%</b></div><div class="row"><span>Card / Netbanking</span><b>10%</b></div></div>
<div class="card"><h4>Aging</h4><div class="row"><span>0–7 days</span><b>${S.students.filter(s=>s.st=='overdue'&&s.d<=7).length}</b></div><div class="row"><span>8–30 days</span><b>${S.students.filter(s=>s.st=='overdue'&&s.d>7).length}</b></div></div>
<div class="grid"><button class="btn alt" onclick="go('gst')">GST summary</button><button class="btn alt" onclick="toast('CSV exported (prototype)')">Export CSV</button></div><br><button class="btn alt" onclick="toast('Target editor (prototype)')">Target: ${inr(S.target)}/mo</button>`)},
gst:()=>{const t=Math.round(360000/1.18);return shell('GST summary',`<div class="card"><label>Period</label><select><option>Q2 Jul–Sep 2026 (quarterly)</option><option>Monthly</option><option>Yearly FY 2026-27</option></select></div><div class="card"><div class="row"><span>Taxable value</span><b>${inr(t)}</b></div><div class="row"><span>GST @18% (SAC 9992)</span><b>${inr(360000-t)}</b></div><div class="row"><span>CGST / SGST</span><b>${inr((360000-t)/2)} each</b></div><div class="row"><span>Total collected</span><b>${inr(360000)}</b></div></div>
<div class="card"><div class="mu">Annual turnover vs registration threshold (₹20 L, configurable)</div><div class="bar"><i style="width:31%"></i></div><b>₹6.1 L / ₹20 L</b></div><div class="grid"><button class="btn alt" onclick="toast('CSV exported')">Export CSV</button><button class="btn alt" onclick="toast('PDF exported')">Export PDF</button></div><p class="mu">ⓘ Assistive only. Confirm with your CA.</p>`,{back:'reports'})},
settings:()=>shell('Settings',['Business profile','Users & roles','Fee defaults & late fee','Reminder templates & cadence','Payment methods (UPI QR / gateway)','GST settings','Targets','Receipt template'].map(x=>`<div class="card click" onclick="${x=='Users & roles'?"go('users')":`toast('${x} (prototype)')`}"><div class="row" style="border:0;padding:0">${x}<span>›</span></div></div>`).join('')+`<button class="btn rd" onclick="S.role=null;go('login')">Log out</button>`,{back:'dash',nonav:1}),
users:()=>shell('Users & roles',`<button class="btn" onclick="sheet('<h4>Invite user</h4><label>Name</label><input><label>Phone</label><input><label>Role</label><select><option>Parent</option><option>Teacher</option><option>Student</option></select><button class=btn onclick=&quot;closeSheet();toast(\\'Invite sent by SMS/WhatsApp\\')&quot;>Send invite</button>')">+ Add user</button><br><br>${[['Anil','Teacher'],['Mia','Teacher'],['Mr. Kumar','Parent'],['Mrs. Mehta','Parent'],['Aarav K.','Student']].map(([n,r])=>`<div class="card"><div class="row" style="border:0;padding:0"><b>${n}</b><span class="badge b-due">${r}</span></div></div>`).join('')}`,{back:'settings',nonav:1}),
receipt:()=>{const r=S.receipts.find(x=>x.n==S.p.n),s=stu(r.s);return shell('Receipt '+r.n,`<div class="rcpt"><b>Sharma Music Class</b><br><span class="mu">GSTIN 29ABCDE1234F1Z5</span><hr><div class="row"><span>Student</span><b>${s.name}</b></div><div class="row"><span>Batch</span>${bat(s.b).name}</div><div class="row"><span>Period</span>${r.m}</div><div class="row"><span>Taxable</span>${inr(Math.round(r.a/1.18))}</div><div class="row"><span>GST 18%</span>${inr(r.a-Math.round(r.a/1.18))}</div><div class="row"><span>Mode</span>${r.mode}</div><div class="row"><b>Total paid</b><b>${inr(r.a)}</b></div></div><br><div class="grid"><button class="btn alt" onclick="toast('PDF downloaded')">⬇ PDF</button><button class="btn" onclick="toast('Shared via WhatsApp')">Share</button></div>`,{back:S.role=='parent'?'prcpt':'dash',nonav:1})},
phome:()=>{const s=stu(S.child),rc=S.receipts.filter(r=>r.s==s.id)[0];return shell('Hi, Mr. Kumar',`<div class="chips">${['s1','s8'].map(i=>`<span class="chip ${S.child==i?'on':''}" onclick="S.child='${i}';render()">${stu(i).name}</span>`).join('')}</div>
<div class="card">${s.st=='paid'?'<h4>✅ All paid for October</h4>':`<div class="mu">Fee due · ${bat(s.b).name}</div><div class="big">${inr(amt(s))}</div>${s.st=='overdue'?`<span class="badge b-overdue">Overdue ${s.d} days</span>`:s.st=='pending'?'<span class="badge b-pending">Proof submitted, awaiting approval</span>':''}<br><br>${s.st=='pending'?'':`<button class="btn" onclick="go('pay')">Pay now</button>`}`}</div>
<div class="card"><h4>Next class</h4><b>${bat(s.b).days.split(' ')[0]} ${bat(s.b).time}</b> · ${bat(s.b).name}</div>
<div class="card"><h4>Latest receipt</h4>${rc?`<div class="row" onclick="go('receipt',{n:'${rc.n}'})" style="cursor:pointer"><span>${rc.n} · ${rc.m}</span><b>${inr(rc.a)} ›</b></div>`:'<span class="mu">None</span>'}</div>`)},
psched:()=>{const s=stu(S.child),b=bat(s.b);return shell('Schedule',`<div class="card"><b>${b.name}</b><div class="mu">${b.days} · ${b.time} · ${b.teacher}</div></div>${['Mon 20 Oct','Wed 22 Oct','Mon 27 Oct'].map(d=>`<div class="card"><div class="row" style="border:0;padding:0"><span>${d} · ${b.time}</span><span class="badge b-due">Reminder on</span></div></div>`).join('')}`)},
pay:()=>{const s=stu(S.child);if(s.st=='paid')return shell('Pay',`<div class="card"><h4>✅ Nothing due for ${s.name}</h4></div>`);
return shell('Pay '+inr(amt(s)),`<div class="card"><label>Choose how to pay</label><div class="chips" id="pm"><span class="chip on" data-m="upi" onclick="pm(this)">UPI apps</span><span class="chip" data-m="card" onclick="pm(this)">Card / Netbanking</span><span class="chip" data-m="proof" onclick="pm(this)">Already paid – upload</span></div><div id="pmbody"></div></div>`,{back:'phome',nonav:1})},
prcpt:()=>shell('Receipts',S.receipts.filter(r=>['s1','s8'].includes(r.s)).map(r=>`<div class="card click" onclick="go('receipt',{n:'${r.n}'})"><div class="row" style="border:0;padding:0"><span><b>${r.n}</b><div class="mu">${stu(r.s).name} · ${r.m}</div></span><b>${inr(r.a)}</b></div></div>`).join('')||'<div class="card mu">No receipts yet</div>'),
tday:()=>shell('Today – Mon 20 Oct',['g1','k2'].map((id,i)=>{const b=bat(id);return`<div class="card"><b>${b.time.split('–')[0]} ${b.name}</b>${S.students.filter(s=>s.b==id).map(s=>`<div class="row"><span>${s.name}</span><label><input type="checkbox" style="width:auto;margin:0" checked> Present</label></div>`).join('')}<br><button class="btn" onclick="toast('Attendance saved')">Save attendance</button></div>`}).join('')),
tbatches:()=>shell('My batches',S.batches.slice(0,2).map(b=>`<div class="card"><b>${b.name}</b><div class="mu">${b.days} ${b.time} · ${S.students.filter(s=>s.b==b.id).length} students</div></div>`).join('')+'<p class="mu">Teachers do not see fee data (configurable).</p>')
};
function pm(el){document.querySelectorAll('#pm .chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');const s=stu(S.child),m=el.dataset.m;
$('#pmbody').innerHTML=m=='upi'?`<div class="chips"><span class="chip">GPay</span><span class="chip">PhonePe</span><span class="chip">Paytm</span></div><button class="btn" onclick="paid('UPI')">Pay ${inr(amt(s))}</button>`:m=='card'?`<input placeholder="Card number"><div class="grid"><input placeholder="MM/YY"><input placeholder="CVV"></div><button class="btn" onclick="paid('Card')">Pay ${inr(amt(s))}</button>`:`<p class="mu">Pay to UPI ID <b>sharmamusic@upi</b>, then upload proof.</p><div class="shot" onclick="this.textContent='✓ screenshot.png attached'">📷 Tap to attach screenshot</div><label>UTR / reference</label><input value="4021553388"><button class="btn" onclick="proof()">Submit proof</button>`}
function paid(m){const s=stu(S.child);s.st='paid';s.paidNow=1;s.mode=m;const n='R-0'+(++S.rcpt);S.receipts.unshift({n,s:s.id,m:'Oct 2026',a:amt(s),mode:m});toast('Payment successful');go('receipt',{n})}
function proof(){stu(S.child).st='pending';toast('Proof submitted. Admin will verify.');go('phome')}
function render(){$('#scr').innerHTML=R[S.screen]();if(S.screen=='pay'&&$('#pm'))pm(document.querySelector('#pm .chip'))}
render();
</script></body></html>
